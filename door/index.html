<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live Blue Iris camera">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Front Door">
<meta name="theme-color" content="#000000">
<title>Front Door</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icons/camera-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/camera-apple-180.png">
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px}
  h1{font-size:24px;font-weight:600}
  #status{font-size:18px;color:#8a8a8a} #status.live{color:#ff5a5a} #status.err{color:#ff6b6b}
  #view{flex:1;display:flex;align-items:center;justify-content:center;width:100%;border:3px solid transparent;border-radius:14px;background:none;padding:0;position:relative;min-height:0}
  #view:focus{outline:none;border-color:#5ad1ff}
  #cam{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;display:block}
  #paused{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:20px;text-shadow:0 0 6px #000}
  .msg{font-size:22px;color:#8a8a8a;line-height:1.35;padding:8px 16px}
  /* porch light switch under the picture */
  #porch{margin:8px 12px 10px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:16px;border:3px solid transparent;background:#141414;color:#fff;font:inherit;font-size:24px;text-align:left}
  #porch:focus{outline:none;border-color:#5ad1ff;background:#1d1d1d}
  #porch .dot{flex:none;width:26px;height:26px;border-radius:50%;background:#3a3a3a;border:3px solid #666}
  #porch.on .dot{background:#ffc94d;border-color:#ffc94d;box-shadow:0 0 12px #ffc94d}
  #porch .pname{flex:1} #porch .pstate{font-weight:600;color:#8a8a8a;text-transform:uppercase} #porch.on .pstate{color:#ffc94d}
  #porch.busy{opacity:.55}
  /* camera menu */
  #menuBtn{display:flex;align-items:center;gap:8px;background:none;border:3px solid transparent;border-radius:12px;color:#fff;font:inherit;font-size:24px;font-weight:600;padding:2px 10px 2px 4px}
  #menuBtn:focus{outline:none;border-color:#5ad1ff;background:#1d1d1d}
  #menuBtn .caret{font-size:18px;color:#5ad1ff}
  #menu{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto}
  #menu h2{font-size:20px;color:#8a8a8a;font-weight:500;padding:0 6px 10px}
  #menu button{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:12px 16px;border-radius:14px;border:3px solid transparent;background:#141414;color:#fff;font:inherit;font-size:24px;text-align:left}
  #menu button:focus{outline:none;border-color:#5ad1ff;background:#1d1d1d}
  #menu button.cur::after{content:"\25CF";margin-left:auto;color:#ff5a5a;font-size:16px}
</style>
</head>
<body>
<header><button id="menuBtn" aria-label="Choose camera"><span id="camName">Front door</span><span class="caret">▾</span></button><span id="status">Connecting…</span></header>
<div id="menu" hidden role="menu"><h2>Choose camera</h2><div id="menuList"></div></div>
<button id="view" aria-label="Front door camera, select to pause or resume" hidden><img id="cam" alt="Front door camera"><span id="paused" hidden>Paused · select to resume</span></button>
<button id="porch" hidden aria-label="Porch light"><span class="dot"></span><span class="pname">Porch light</span><span class="pstate"></span></button>
<div id="info" class="msg" hidden></div>
<script src="../shared.js?v=12"></script>
<script>
(function () {
  var LABEL = "glasses_door";   // HA label: the camera carrying it is the one shown here
  var CAMERA = "camera.ades_security_utility";
  var FRAME_GAP = 1500;         // ms between stills: kept low so the glasses' connection isn't flooded with requests
  var AUTO_PAUSE = 2 * 60000;   // pause after 2 minutes so a forgotten app doesn't keep pulling pictures
  var $view = document.getElementById("view"), $cam = document.getElementById("cam"), $status = document.getElementById("status"),
      $info = document.getElementById("info"), $paused = document.getElementById("paused");
  // tidy Blue Iris names ("ades security front door (Cam2) …" -> "Front door")
  var NICE = { "camera.ades_security_utility": "Utility", "camera.ades_security_front_door": "Front door",
    "camera.ades_security_connor_s_room": "Connor's room", "camera.ades_security_caravan_internal": "Caravan internal",
    "camera.ades_security_caravaninside_cam3_ades_security_caravaninside": "Caravan inside", "camera.ades_security_all_cameras": "All cameras" };
  var ORDER = ["camera.ades_security_utility", "camera.ades_security_front_door", "camera.ades_security_connor_s_room",
    "camera.ades_security_caravan_internal", "camera.ades_security_caravaninside_cam3_ades_security_caravaninside", "camera.ades_security_all_cameras"];
  function nice(e){
    if (NICE[e.entity_id]) return NICE[e.entity_id];
    var n = String(e.name || e.entity_id).replace(/^ades security\s*\+?/i, "").replace(/\s*\(.*$/, "").trim();
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  try { var saved = localStorage.getItem("door_camera"); if (saved) CAMERA = saved; } catch (e) {}
  var cams = [], $menu = document.getElementById("menu"), $menuList = document.getElementById("menuList"),
      $menuBtn = document.getElementById("menuBtn"), $camName = document.getElementById("camName");
  function buildMenu(){
    $menuList.innerHTML = "";
    cams.forEach(function(c){
      var b = document.createElement("button");
      b.textContent = c.name; b.setAttribute("role", "menuitem");
      if (c.id === CAMERA) b.className = "cur";
      b.addEventListener("click", function(){ choose(c.id); });
      $menuList.appendChild(b);
    });
  }
  function openMenu(){
    if (!cams.length) return;
    stop(); buildMenu(); $menu.hidden = false;
    var cur = $menuList.querySelector(".cur") || $menuList.firstChild; if (cur) cur.focus();
  }
  function closeMenu(){ $menu.hidden = true; $menuBtn.focus(); }
  function choose(id){
    CAMERA = id; try { localStorage.setItem("door_camera", id); } catch (e) {}
    $menu.hidden = true; $cam.removeAttribute("src"); start();
  }
  $menuBtn.addEventListener("click", openMenu);
  document.addEventListener("keydown", function(ev){ if (!$menu.hidden && (ev.key === "Escape" || ev.key === "Backspace")) { ev.preventDefault(); closeMenu(); if (!paused) start(); } });
  var porchId = null, $porch = document.getElementById("porch");
  function porchShow(st){
    $porch.hidden = false; $porch.classList.remove("busy");
    $porch.classList.toggle("on", st === "on");
    $porch.querySelector(".pstate").textContent = (st === "on" || st === "off") ? st : "—";
    $porch.setAttribute("aria-label", "Porch light, " + st);
  }
  $porch.addEventListener("click", function(){
    if (!porchId) return;
    var want = $porch.classList.contains("on") ? "off" : "on";
    $porch.classList.add("busy");
    ha.service("homeassistant", want === "on" ? "turn_on" : "turn_off", { entity_id: porchId })
      .then(function(){ porchShow(want); })
      .catch(function(){ $porch.classList.remove("busy"); status("Porch light failed", true); });
  });
  var ha = GlassesHA, camToken = null, paused = false, timer = null, tokTimer = null, startedAt = 0, running = false, fails = 0;
  function status(t, cls){ $status.textContent = t; $status.className = cls === true ? "err" : (cls || ""); }
  function info(h){ $info.hidden = !h; $info.innerHTML = h || ""; }
  var H = {
    noToken: function(){ status("Not set up", true); info("This app needs your Home Assistant access token on the end of its link:<br><b>…/door/?token=YOUR_TOKEN</b>"); },
    badToken: function(){ status("Token rejected", true); $view.hidden = true; info("Home Assistant rejected the access token. Re-add the app with a valid token on the link."); }
  };

  // The camera's own access token rotates every few minutes; fetch it with an ordinary request.
  function refreshToken(){
    clearTimeout(tokTimer);
    return ha.entities(LABEL).then(function(list){
      var all = list.filter(function(e){ return e.entity_id.indexOf("camera.") === 0; });
      cams = all.map(function(e){ return { id: e.entity_id, name: nice(e) }; });
      cams.sort(function(a, b){ var i = ORDER.indexOf(a.id), j = ORDER.indexOf(b.id);
        return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || a.name.localeCompare(b.name); });
      var s = all.filter(function(e){ return e.entity_id === CAMERA; })[0] || all[0];
      if (!s) { status("No camera", true); info("In Home Assistant, add the <b>Glasses Door</b> label to the camera to show here."); throw new Error("no camera"); }
      CAMERA = s.entity_id;
      var nm = nice(s); $camName.textContent = nm; document.title = nm;
      $view.setAttribute("aria-label", nm + " camera, select to pause or resume"); $cam.alt = nm + " camera";
      // the light or switch carrying the same label is the porch light
      var p = list.filter(function(e){ return /^(light|switch)\./.test(e.entity_id); })[0];
      if (p) { porchId = p.entity_id; porchShow(p.state); }
      if (s.state === "unavailable") status("Camera offline", true);
      var t = s.access_token;
      if (t) camToken = t;
      $view.hidden = false; info("");
      tokTimer = setTimeout(refreshToken, 60000);
      return t;
    }, function(e){
      var t = ha.describe(e, H); if (t === null) throw e;
      status(t, true);
      if (t === "Offline") ha.explain(e, $info, function(){ return $status.textContent === "Offline"; });
      throw e;
    });
  }

  function frame(){
    clearTimeout(timer);
    if (!running) return;
    if (Date.now() - startedAt > AUTO_PAUSE) { pause(); return; }
    var next = new Image(), t0 = Date.now();
    next.onload = function(){ if (!running) return; fails = 0; $cam.src = next.src; status("● Live", "live"); info("");
      timer = setTimeout(frame, Math.max(0, FRAME_GAP - (Date.now() - t0))); };
    next.onerror = function(){ if (!running) return; fails++; status("Reconnecting…", true);
      if (fails % 2 === 0) ha.otherRoute();   // pictures not getting through this way: try the other route
      timer = setTimeout(function(){ (fails % 3 === 0 ? refreshToken() : Promise.resolve()).then(frame, function(){ timer = setTimeout(frame, 4000); }); }, 2000); };
    next.src = ha.base() + "/api/camera_proxy/" + CAMERA + "?token=" + encodeURIComponent(camToken) + "&t=" + Date.now();
  }
  function stop(){ running = false; clearTimeout(timer); clearTimeout(tokTimer); }
  function pause(){ stop(); paused = true; $paused.hidden = false; status("Paused"); }
  function start(){
    stop(); paused = false; $paused.hidden = true; status("Connecting…");
    refreshToken().then(function(){ running = true; startedAt = Date.now(); $view.focus(); frame(); },
      function(){ if (!paused && !document.hidden) timer = setTimeout(start, 5000); });
  }

  $view.addEventListener("click", function(){ if (paused || !running) start(); else pause(); });
  document.addEventListener("visibilitychange", function(){ if (document.hidden) stop(); else if (!paused) start(); });
  window.addEventListener("pagehide", stop);
  document.addEventListener("freeze", stop);
  // leaving the app (even if the glasses keep it running): stop fetching straight away; select the picture to resume
  window.addEventListener("blur", function(){ if (running) pause(); });
  window.addEventListener("online", function(){ if (!paused && !document.hidden) start(); });
  start();
})();
</script>
</body>
</html>
