<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Walking directions from Google Maps">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Navigate">
<meta name="theme-color" content="#000000">
<title>Navigate</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icons/nav-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/nav-apple-180.png">
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
  h1{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #status{font-size:17px;color:#8a8a8a;white-space:nowrap}
  #status.err{color:#ff6b6b}
  button{font:inherit;color:#fff;background:#141414;border:3px solid transparent;border-radius:14px}
  button:focus,input:focus{outline:none;border-color:#5ad1ff}
  .msg{font-size:21px;color:#8a8a8a;line-height:1.35;padding:10px 16px}
  .msg b{color:#fff}

  /* ---- choose a destination ---- */
  #pick{flex:1;display:flex;flex-direction:column;min-height:0;padding:4px 12px 10px;gap:8px}
  #q{width:100%;font:inherit;font-size:24px;color:#fff;background:#141414;border:3px solid #333;border-radius:14px;padding:12px 14px}
  #list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
  #list h2{font-size:17px;color:#8a8a8a;font-weight:500;padding:4px 4px 0}
  .place{display:block;width:100%;text-align:left;padding:10px 14px}
  .place .n{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .place .a{font-size:17px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  /* ---- navigating ---- */
  #nav{flex:1;display:flex;flex-direction:column;min-height:0}
  #turn{display:flex;align-items:center;gap:16px;padding:6px 16px 4px}
  #arrow{flex:none;width:118px;height:118px;color:#5ad1ff}
  #arrow svg{width:100%;height:100%;transition:transform .3s}
  #dist{font-size:58px;font-weight:700;line-height:1}
  #dist small{font-size:28px;font-weight:600;color:#8a8a8a;margin-left:4px}
  #instr{font-size:24px;line-height:1.25;padding:2px 16px 6px;max-height:3.9em;overflow:hidden}
  #then{font-size:18px;color:#8a8a8a;padding:0 16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mapwrap{flex:1;min-height:0;margin:0 12px;border-radius:14px;overflow:hidden;position:relative;background:#0b0b0b}
  #map{position:absolute;inset:0}
  #foot{display:flex;align-items:center;gap:8px;padding:8px 12px 10px}
  #left{flex:1;font-size:20px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #left b{color:#fff}
  #foot button{font-size:19px;padding:8px 12px}
  #arrived{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
  #arrived .big{font-size:34px;font-weight:700;color:#5ad1ff}
  #arrived button{font-size:22px;padding:12px 24px}
</style>
</head>
<body>
<header><h1 id="title">Navigate</h1><span id="status"></span></header>

<div id="setup" class="msg" hidden>
  <b>Google Maps key needed.</b><br><br>
  Add this app on your phone using the link that ends in <b>#key=</b> followed by your Google Maps API key.
  The key is kept on the glasses only.
</div>

<div id="pick" hidden>
  <input id="q" type="search" placeholder="Where to?" autocomplete="off" enterkeyhint="search" aria-label="Search for a place">
  <div id="list" role="list"></div>
</div>

<div id="nav" hidden>
  <div id="turn"><div id="arrow" aria-hidden="true"></div><div id="dist" aria-live="polite">—</div></div>
  <div id="instr">Finding where you are…</div>
  <div id="then"></div>
  <div id="mapwrap"><div id="map"></div></div>
  <div id="foot">
    <div id="left"></div>
    <button id="mapBtn" aria-label="Change the map: street, satellite or none">Map</button>
    <button id="endBtn" aria-label="End navigation">End</button>
  </div>
</div>

<div id="arrived" hidden>
  <div class="big">You've arrived</div>
  <div id="arrName" class="msg"></div>
  <button id="doneBtn">Done</button>
</div>

<script src="../shared.js?v=12"></script>
<script>
(function () {
  "use strict";
  // ---------- settings ----------
  var KEY_STORE = "glasses_gmaps_key", RECENT = "glasses_nav_recent", ACTIVE = "glasses_nav_active", MAPPREF = "glasses_nav_map";
  var ARRIVE_M = 20;        // within this of the destination = arrived
  var STEP_DONE_M = 12;     // within this of the end of a step = move on to the next
  var OFF_ROUTE_M = 40;     // further than this from the route (3 fixes running) = re-plan
  var $ = function (id) { return document.getElementById(id); };
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch (e) {} }
  function load(k, json) { try { var v = localStorage.getItem(k); return json ? (v ? JSON.parse(v) : null) : v; } catch (e) { return null; } }

  // the API key comes from the link (#key=…) once, then lives in local storage on the glasses
  // optional destination in the link: #to=Some+Place
  var linkTo = (location.hash || "").match(/to=([^&]+)/);
  var m = (location.hash || "").match(/key=([^&]+)/);
  if (m) { store(KEY_STORE, decodeURIComponent(m[1]).trim()); try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  var KEY = load(KEY_STORE);

  function status(t, bad) { var s = $("status"); s.textContent = t || ""; s.className = bad ? "err" : ""; }
  function show(id) { ["setup", "pick", "nav", "arrived"].forEach(function (x) { $(x).hidden = x !== id; }); }

  // ---------- geometry ----------
  function rad(d) { return d * Math.PI / 180; }
  function dist(a, b) {   // metres between {lat,lng}
    var R = 6371000, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function segDist(p, a, b) {   // metres from p to segment a-b (flat-earth, fine at street scale)
    var k = Math.cos(rad(p.lat)) * 111320, ax = (a.lng - p.lng) * k, ay = (a.lat - p.lat) * 110540,
        bx = (b.lng - p.lng) * k, by = (b.lat - p.lat) * 110540, dx = bx - ax, dy = by - ay,
        L = dx * dx + dy * dy, t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
    var x = ax + t * dx, y = ay + t * dy; return Math.sqrt(x * x + y * y);
  }
  function decode(str) {   // Google encoded polyline -> [{lat,lng}]
    var pts = [], i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      var b, s = 0, r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32); lat += (r & 1) ? ~(r >> 1) : (r >> 1);
      s = 0; r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32); lng += (r & 1) ? ~(r >> 1) : (r >> 1);
      pts.push({ lat: lat / 1e5, lng: lng / 1e5 });
    }
    return pts;
  }
  function fmtDist(mtr) {
    if (mtr < 1000) { var r = mtr < 100 ? Math.round(mtr / 5) * 5 : Math.round(mtr / 10) * 10; return { n: String(r), u: "m" }; }
    return { n: (mtr / 1000).toFixed(mtr < 10000 ? 1 : 0), u: "km" };
  }
  function fmtMin(sec) { var mn = Math.max(1, Math.round(sec / 60)); return mn < 60 ? mn + " min" : Math.floor(mn / 60) + " h " + (mn % 60) + " min"; }
  function clock(d) { return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function ll(o) { return o && o.latLng ? { lat: o.latLng.latitude, lng: o.latLng.longitude } : null; }

  // ---------- turn arrows ----------
  var ANG = { STRAIGHT: 0, DEPART: 0, NAME_CHANGE: 0, MERGE: 0, TURN_SLIGHT_LEFT: -45, TURN_SLIGHT_RIGHT: 45, TURN_LEFT: -90, TURN_RIGHT: 90,
    TURN_SHARP_LEFT: -135, TURN_SHARP_RIGHT: 135, UTURN_LEFT: -180, UTURN_RIGHT: 180, FORK_LEFT: -30, FORK_RIGHT: 30, RAMP_LEFT: -30, RAMP_RIGHT: 30 };
  var SVG_ARROW = '<svg viewBox="0 0 100 100"><path d="M50 8 L82 46 H62 V92 H38 V46 H18 Z" fill="currentColor"/></svg>';
  var SVG_ROUND = '<svg viewBox="0 0 100 100"><circle cx="50" cy="56" r="22" fill="none" stroke="currentColor" stroke-width="10"/><path d="M50 4 L70 30 H56 V34 H44 V30 H30 Z" fill="currentColor"/></svg>';
  var SVG_FLAG = '<svg viewBox="0 0 100 100"><path d="M26 92 V10 M26 12 H78 L66 30 L78 48 H26" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/></svg>';
  function setArrow(man) {
    var el = $("arrow");
    if (man === "ARRIVE") { el.innerHTML = SVG_FLAG; return; }
    if (/ROUNDABOUT/.test(man || "")) { el.innerHTML = SVG_ROUND; return; }
    el.innerHTML = SVG_ARROW;
    var a = ANG[man] != null ? ANG[man] : 0;
    el.firstChild.style.transform = "rotate(" + a + "deg)";
  }

  // ---------- Google APIs (plain requests, key in a header) ----------
  var inflight = [];
  function gpost(url, body, mask) {
    var ctl = new AbortController(); inflight.push(ctl);
    var h = { "Content-Type": "application/json", "X-Goog-Api-Key": KEY };
    if (mask) h["X-Goog-FieldMask"] = mask;
    return fetch(url, { method: "POST", headers: h, body: JSON.stringify(body), signal: ctl.signal })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status)); return j; }); })
      .finally(function () { inflight = inflight.filter(function (c) { return c !== ctl; }); });
  }
  function abortAll() { inflight.forEach(function (c) { try { c.abort(); } catch (e) {} }); inflight = []; }

  // ---------- where am I ----------
  var pos = null, acc = null, watchId = null, pending = null;
  function startGps() {
    if (watchId !== null) return;
    if (!navigator.geolocation) { status("No location", true); $("instr").textContent = "These glasses aren't sharing a location with this app."; return; }
    watchId = navigator.geolocation.watchPosition(function (p) {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude }; acc = p.coords.accuracy;
      if ($("status").textContent === "No location") status("");
      var cb = pending; pending = null; if (cb) cb();
      update();
    }, function (e) {
      status("No location", true);
      if (!$("nav").hidden) $("instr").textContent = e.code === 1 ? "Location is turned off for this app. Allow location in the Meta AI app, then try again." : "Waiting for your location…";
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  }
  function stopGps() { if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} watchId = null; } }
  function firstFix(cb) { startGps(); if (pos) cb(); else pending = cb; }

  // ---------- choosing a destination ----------
  var recent = load(RECENT, true) || [];
  function placeBtn(p, onClick) {
    var b = document.createElement("button"); b.className = "place"; b.setAttribute("role", "listitem");
    b.innerHTML = '<div class="n"></div><div class="a"></div>';
    b.querySelector(".n").textContent = p.name; b.querySelector(".a").textContent = p.addr || "";
    b.addEventListener("click", function () { onClick(p); });
    return b;
  }
  function showRecent() {
    var l = $("list"); l.innerHTML = "";
    if (!recent.length) { var d = document.createElement("div"); d.className = "msg"; d.textContent = "Type a place, postcode or address."; l.appendChild(d); return; }
    var h = document.createElement("h2"); h.textContent = "Recent"; l.appendChild(h);
    recent.forEach(function (p) { l.appendChild(placeBtn(p, go)); });
  }
  var qTimer = null, qSeq = 0;
  $("q").addEventListener("input", function () {
    clearTimeout(qTimer);
    var t = $("q").value.trim();
    if (t.length < 3) { showRecent(); return; }
    qTimer = setTimeout(function () { search(t); }, 450);
  });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { clearTimeout(qTimer); var t = $("q").value.trim(); if (t) search(t, true); } });
  function search(t, pickFirst) {
    var seq = ++qSeq; status("Searching…");
    var body = { input: t, includedRegionCodes: ["gb"], languageCode: "en-GB" };
    if (pos) body.locationBias = { circle: { center: { latitude: pos.lat, longitude: pos.lng }, radius: 30000 } };
    gpost("https://places.googleapis.com/v1/places:autocomplete", body).then(function (j) {
      if (seq !== qSeq) return;
      status("");
      var res = (j.suggestions || []).filter(function (s) { return s.placePrediction; }).map(function (s) {
        var pp = s.placePrediction, sf = pp.structuredFormat || {};
        return { placeId: pp.placeId, name: (sf.mainText && sf.mainText.text) || pp.text.text, addr: (sf.secondaryText && sf.secondaryText.text) || "" };
      });
      var l = $("list"); l.innerHTML = "";
      if (!res.length) { var d = document.createElement("div"); d.className = "msg"; d.textContent = "Nothing found for “" + t + "”."; l.appendChild(d); return; }
      if (pickFirst && res.length === 1) { go(res[0]); return; }
      res.forEach(function (p) { l.appendChild(placeBtn(p, go)); });
      var first = l.querySelector("button"); if (pickFirst && first) first.focus();
    }).catch(function (e) { if (seq !== qSeq || e.name === "AbortError") return; status("Search failed", true); $("list").innerHTML = '<div class="msg"></div>'; $("list").firstChild.textContent = keyHint(e); });
  }
  function keyHint(e) {
    var s = String(e && e.message || e);
    if (/API key|not authorized|PERMISSION_DENIED|referer|has not been used|disabled/i.test(s)) return "Google refused the key: " + s;
    return "Couldn't reach Google Maps. Check the phone has signal. (" + s + ")";
  }

  // ---------- navigating ----------
  var dest = null, route = null, stepI = 0, offCount = 0, lastPlan = 0, planning = false;
  function go(p) {
    dest = p; store(ACTIVE, p);
    recent = [p].concat(recent.filter(function (r) { return (r.placeId || r.name) !== (p.placeId || p.name); })).slice(0, 8);
    store(RECENT, recent);
    $("title").textContent = p.name; show("nav"); setArrow("DEPART");
    $("dist").innerHTML = "—"; $("instr").textContent = "Finding where you are…"; $("then").textContent = ""; $("left").textContent = "";
    wake(true); applyMapPref();
    firstFix(plan);
  }
  function plan() {
    if (!dest || planning || !pos) return;
    planning = true; lastPlan = Date.now(); status("Planning…");
    var destination = dest.placeId ? { placeId: dest.placeId } : (dest.lat != null ? { location: { latLng: { latitude: dest.lat, longitude: dest.lng } } } : { address: dest.name });
    gpost("https://routes.googleapis.com/directions/v2:computeRoutes", {
      origin: { location: { latLng: { latitude: pos.lat, longitude: pos.lng } } },
      destination: destination, travelMode: "WALK", languageCode: "en-GB", units: "METRIC"
    }, "routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.steps.distanceMeters,routes.legs.steps.staticDuration,routes.legs.steps.startLocation,routes.legs.steps.endLocation,routes.legs.steps.navigationInstruction,routes.legs.steps.polyline.encodedPolyline,routes.legs.endLocation")
    .then(function (j) {
      planning = false;
      var r = j.routes && j.routes[0];
      if (!r) { status("No route", true); $("instr").textContent = "Google couldn't find a walking route there."; return; }
      var steps = [];
      (r.legs || []).forEach(function (lg) { (lg.steps || []).forEach(function (s) {
        steps.push({ m: s.distanceMeters || 0, sec: parseFloat(s.staticDuration) || 0, a: ll(s.startLocation), b: ll(s.endLocation),
          man: (s.navigationInstruction && s.navigationInstruction.maneuver) || "STRAIGHT",
          txt: (s.navigationInstruction && s.navigationInstruction.instructions) || "",
          pts: s.polyline ? decode(s.polyline.encodedPolyline) : [] });
      }); });
      var lastLeg = r.legs[r.legs.length - 1];
      route = { steps: steps, pts: decode(r.polyline.encodedPolyline), end: ll(lastLeg.endLocation) || (steps.length ? steps[steps.length - 1].b : null),
        total: r.distanceMeters || 0, secs: parseFloat(r.duration) || 0 };
      stepI = 0; offCount = 0; status("");
      drawRoute(); update();
    }).catch(function (e) { planning = false; if (e.name === "AbortError") return; status("Route failed", true); $("instr").textContent = keyHint(e); });
  }
  function nearestStep() {   // which step am I on (closest polyline segment, not going backwards)
    var best = stepI, bestD = Infinity;
    for (var i = stepI; i < Math.min(route.steps.length, stepI + 4); i++) {
      var p = route.steps[i].pts;
      for (var k = 1; k < p.length; k++) { var d = segDist(pos, p[k - 1], p[k]); if (d < bestD) { bestD = d; best = i; } }
    }
    return { i: best, off: bestD };
  }
  function update() {
    if (!route || !pos || $("nav").hidden) return;
    var toEnd = route.end ? dist(pos, route.end) : Infinity;
    if (toEnd <= ARRIVE_M) { arrive(); return; }
    var n = nearestStep();
    if (n.i > stepI) stepI = n.i;
    var cur = route.steps[stepI];
    if (cur && cur.b && dist(pos, cur.b) <= STEP_DONE_M && stepI < route.steps.length - 1) { stepI++; cur = route.steps[stepI]; }
    // off the route? re-plan after 3 fixes in a row, at most every 20 s
    if (n.off > OFF_ROUTE_M + Math.min(acc || 0, 40)) { offCount++; } else offCount = 0;
    if (offCount >= 3 && Date.now() - lastPlan > 20000) { status("Re-routing…"); offCount = 0; plan(); return; }

    // the next thing to do happens at the end of this step (= the next step's instruction)
    var next = route.steps[stepI + 1];
    var dNext = cur && cur.b ? dist(pos, cur.b) : toEnd;
    if (stepI === 0 && cur && cur.a && dist(pos, cur.a) < 25 && dNext > 30) {   // just setting off: show "Head north on …"
      setArrow(cur.man); $("instr").textContent = cur.txt || "Head off";
    } else if (next) {
      setArrow(next.man); $("instr").textContent = next.txt || "Continue";
    } else {
      setArrow("ARRIVE"); $("instr").textContent = "Arrive at " + (dest ? dest.name : "your destination");
    }
    var f = fmtDist(next ? dNext : toEnd); $("dist").innerHTML = f.n + "<small>" + f.u + "</small>";
    var after = route.steps[stepI + 2];
    $("then").textContent = after && after.txt ? "Then: " + after.txt : "";
    // what's left
    var leftM = dNext; for (var i = stepI + 1; i < route.steps.length; i++) leftM += route.steps[i].m;
    var speed = route.total ? route.secs / route.total : 0.75;   // seconds per metre from Google's estimate
    var leftS = leftM * speed;
    var lf = fmtDist(leftM);
    $("left").innerHTML = "<b>" + fmtMin(leftS) + "</b> · " + lf.n + " " + lf.u + " · arrive " + clock(new Date(Date.now() + leftS * 1000));
    moveMe();
  }
  function arrive() {
    stopNav(false);
    $("arrName").textContent = dest ? dest.name : ""; show("arrived"); $("doneBtn").focus();
    store(ACTIVE, null);
  }
  function stopNav(clearDest) {
    route = null; abortAll(); stopGps(); wake(false); pending = null;
    if (clearDest) { dest = null; store(ACTIVE, null); }
  }
  function toPick() { stopNav(true); $("title").textContent = "Navigate"; status(""); show("pick"); showRecent(); $("q").value = ""; $("q").focus(); startGps(); }
  $("endBtn").addEventListener("click", toPick);
  $("doneBtn").addEventListener("click", toPick);

  // ---------- small map (optional) ----------
  var map = null, line = null, me = null, mapsLoading = false;
  var DARK = [{ elementType: "geometry", stylers: [{ color: "#111111" }] }, { elementType: "labels.text.fill", stylers: [{ color: "#9a9a9a" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#000000" }] }, { featureType: "road", elementType: "geometry", stylers: [{ color: "#2b2b2b" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#06202c" }] }, { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "transit", stylers: [{ visibility: "off" }] }];
  // map button cycles: street map -> satellite -> no map -> street map
  function mapOn() { return load(MAPPREF) !== "off"; }
  function isSat() { return load(MAPPREF) === "sat"; }
  function mapType() { return isSat() ? "hybrid" : "roadmap"; }   // hybrid = satellite photo with road names
  function applyMapPref() {
    $("mapwrap").hidden = !mapOn();
    $("mapBtn").textContent = !mapOn() ? "Map" : (isSat() ? "Hide map" : "Satellite");
    if (map) map.setMapTypeId(mapType());
    if (mapOn()) loadMaps();
  }
  $("mapBtn").addEventListener("click", function () { store(MAPPREF, !mapOn() ? "on" : (isSat() ? "off" : "sat")); applyMapPref(); drawRoute(); });
  function loadMaps() {
    if (window.google && google.maps) { initMap(); return; }
    if (mapsLoading) return; mapsLoading = true;
    window.__navMapsReady = function () { initMap(); drawRoute(); };
    var s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(KEY) + "&v=weekly&loading=async&callback=__navMapsReady";
    s.async = true; s.onerror = function () { mapsLoading = false; };
    document.head.appendChild(s);
  }
  function initMap() {
    if (map || !window.google || !google.maps || !google.maps.Map) return;
    map = new google.maps.Map($("map"), { center: pos || { lat: 53.45, lng: -2.73 }, zoom: 17, disableDefaultUI: true, keyboardShortcuts: false,
      gestureHandling: "none", clickableIcons: false, styles: DARK, backgroundColor: "#000000", mapTypeId: mapType(), tilt: 0 });
  }
  function drawRoute() {
    if (!map || !route || !mapOn()) return;
    if (line) line.setMap(null);
    line = new google.maps.Polyline({ path: route.pts, strokeColor: "#5ad1ff", strokeOpacity: 0.95, strokeWeight: 6, map: map });
    moveMe();
  }
  function moveMe() {
    if (!map || !pos || !mapOn()) return;
    if (!me) me = new google.maps.Marker({ map: map, position: pos, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: "#ffffff", fillOpacity: 1, strokeColor: "#5ad1ff", strokeWeight: 3 } });
    else me.setPosition(pos);
    map.panTo(pos);
  }

  // ---------- keep the display awake while navigating ----------
  var lock = null;
  function wake(on) {
    try {
      if (on && !lock && navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
      if (!on && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }

  // ---------- leaving / coming back (shared.js reloads after 45 s away; resume the trip) ----------
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { abortAll(); stopGps(); lock = null; }
    else if (dest && !$("nav").hidden) { wake(true); startGps(); }
  });

  // ---------- start ----------
  if (!KEY) { show("setup"); return; }
  var active = load(ACTIVE, true);
  if (linkTo) { go({ name: decodeURIComponent(linkTo[1]).replace(/\+/g, " "), addr: "" }); }
  else if (active) { go(active); }
  else { show("pick"); showRecent(); startGps(); setTimeout(function () { $("q").focus(); }, 300); }
})();
</script>
</body>
</html>
