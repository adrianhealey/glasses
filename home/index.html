<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Switch Home Assistant lights and switches on and off">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Home">
<meta name="theme-color" content="#000000">
<title>Home</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icons/switches-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/switches-apple-180.png">
<style>
  [hidden]{display:none!important}
  :root{--on:#ffc94d;--focus:#5ad1ff;--dim:#8a8a8a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;height:100%}
  body{display:flex;flex-direction:column;padding:14px 16px 10px}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  h1{font-size:26px;font-weight:600}
  #status{font-size:18px;color:var(--dim)} #status.err{color:#ff6b6b}
  main{flex:1;overflow-y:auto}
  ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  button.ent{width:100%;display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:18px;border:3px solid transparent;background:#141414;color:#fff;font:inherit;text-align:left;min-height:74px}
  button.ent:focus{outline:none;border-color:var(--focus);background:#1d1d1d}
  .dot{flex:none;width:30px;height:30px;border-radius:50%;background:#3a3a3a;border:3px solid #666}
  .on .dot{background:var(--on);border-color:var(--on);box-shadow:0 0 14px var(--on)}
  .name{flex:1;font-size:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .state{font-size:22px;color:var(--dim);font-weight:600;text-transform:uppercase}
  .on .state{color:var(--on)} .busy{opacity:.55} .unavail .name,.unavail .state{color:#555}
  .msg{font-size:22px;color:var(--dim);line-height:1.35;padding:6px 2px}
  button.room .dot{border-radius:10px}
  button.back{width:100%;padding:10px 18px;border-radius:16px;border:3px solid transparent;background:#101820;color:#bfe3ff;font:inherit;font-size:22px;text-align:left;margin-bottom:10px}
  button.back:focus{outline:none;border-color:var(--focus)}
</style>
</head>
<body>
<header><h1 id="title">Home</h1><span id="status">Connecting…</span></header>
<main><button class="back" id="back" hidden>◀ Rooms</button><ul id="list"></ul><div id="info" class="msg" hidden></div></main>
<script src="../shared.js?v=8"></script>
<script>
(function () {
  var LABEL = "glasses";   // HA label id: entities carrying it appear here, grouped by their Home Assistant area
  var OTHER = "Other";
  // Rooms for the glasses only (these entities have no area in Home Assistant, or are shown in a different room here)
  var ROOMS = {
    "input_boolean.cooker_hood_light": "Kitchen",
    "switch.hallway_lamp": "Hallway",
    "switch.media_wall": "Living Room",
    "input_boolean.fire": "Living Room",
    "switch.blue_lamp": "Living Room",
    "input_boolean.alexa_trigger": "Kitchen"
  };
  // Names for the glasses only
  var NAMES = { "input_boolean.alexa_trigger": "Coffee machine" };
  var $list = document.getElementById("list"), $status = document.getElementById("status"), $info = document.getElementById("info"),
      $back = document.getElementById("back"), $title = document.getElementById("title");
  var ha = GlassesHA, ents = [], states = {}, names = {}, rooms = {}, timer = null, busyUntil = {}, room = null, shown = "";
  function status(t, err){ $status.textContent = t; $status.className = err ? "err" : ""; }
  function info(h){ $info.hidden = !h; $info.innerHTML = h || ""; }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function clean(n){ n = String(n).trim(); var w = n.split(/\s+/), h = w.length / 2;
    if (w.length % 2 === 0 && w.slice(0,h).join(" ").toLowerCase() === w.slice(h).join(" ").toLowerCase()) n = w.slice(0,h).join(" ");
    return n.charAt(0).toUpperCase() + n.slice(1); }
  var ON = ["on","open","unlocked","playing","heat","home"];
  var H = {
    noToken: function(){ status("Not set up", true); info("This app needs your Home Assistant access token on the end of its link:<br><b>…/home/?token=YOUR_TOKEN</b>"); },
    badToken: function(){ status("Token rejected", true); $list.innerHTML = ""; info("Home Assistant rejected the access token. Re-add the app with a valid token on the link."); }
  };
  function failed(e){
    var t = ha.describe(e, H); if (t) status(t, true);
    if (t === "Offline") ha.explain(e, $info, function(){ return $status.textContent === "Offline"; });   // show why
    return t;
  }
  function roomNames(){
    return Object.keys(rooms).sort(function(a, b){ return a === OTHER ? 1 : b === OTHER ? -1 : a.localeCompare(b); });
  }
  function grouped(){ return roomNames().length > 1; }

  // Rooms view (when entities span more than one room) or the entities of one room
  function render(){
    var showRooms = grouped() && !room;
    var ids = showRooms ? roomNames() : (room ? (rooms[room] || []) : ents).slice().sort(function(a,b){ return (names[a]||a).localeCompare(names[b]||b); });
    var key = (showRooms ? "R:" : "E:") + ids.join(",");
    $back.hidden = showRooms || !grouped();
    $title.textContent = showRooms || !room ? "Home" : room;
    if (key !== shown) {
      shown = key;
      $list.innerHTML = ids.map(function(id){
        return '<li><button class="ent' + (showRooms ? ' room' : '') + '" data-id="' + esc(id) + '"><span class="dot"></span><span class="name"></span><span class="state"></span></button></li>'; }).join("");
      [].forEach.call($list.querySelectorAll("button.ent"), function(b){
        b.addEventListener("click", function(){ if (b.classList.contains("room")) openRoom(b.dataset.id); else toggle(b); }); });
      var f = $list.querySelector("button.ent"); if (f) f.focus();
    }
    [].forEach.call($list.querySelectorAll("button.ent"), function(b){
      var id = b.dataset.id;
      if (b.classList.contains("room")) {
        var members = rooms[id] || [], on = members.filter(function(m){ return ON.indexOf(states[m]) >= 0; }).length;
        b.classList.toggle("on", on > 0);
        b.querySelector(".name").textContent = id;
        b.querySelector(".state").textContent = on ? on + " on" : "off";
        b.setAttribute("aria-label", id + ", " + (on ? on + " on" : "all off"));
        return;
      }
      var st = states[id], isOn = ON.indexOf(st) >= 0, un = !st || st === "unavailable" || st === "unknown";
      b.classList.toggle("on", isOn); b.classList.toggle("unavail", un);
      b.classList.toggle("busy", (busyUntil[id] || 0) > Date.now());
      b.querySelector(".name").textContent = names[id] || id;
      b.querySelector(".state").textContent = un ? "—" : (/^(script|scene|button|input_button)\./.test(id) ? "run" : st);
      b.setAttribute("aria-label", (names[id]||id) + ", " + (un ? "unavailable" : st));
    });
    if (!document.activeElement || document.activeElement === document.body) { var g = $list.querySelector("button.ent"); if (g) g.focus(); }
  }

  function openRoom(r){ room = r; shown = ""; history.pushState({ room:r }, "", location.pathname + location.search + "#room"); render(); }
  function closeRoom(){ var was = room; room = null; shown = ""; render();
    var b = was && $list.querySelector('[data-id="' + was.replace(/"/g, '\\"') + '"]'); if (b) b.focus(); }
  $back.addEventListener("click", function(){ history.back(); });
  window.addEventListener("popstate", function(){ if (room) closeRoom(); });
  document.addEventListener("keydown", function(e){ if ((e.key === "Escape" || e.key === "Backspace") && room) { e.preventDefault(); history.back(); } });

  function load(){
    clearTimeout(timer);
    if (document.hidden) return;
    ha.entities(LABEL).then(function(list){
      ents = list.map(function(e){ return e.entity_id; });
      rooms = {};
      list.forEach(function(e){ var prev = states[e.entity_id]; states[e.entity_id] = e.state; names[e.entity_id] = NAMES[e.entity_id] || clean(e.name);
        var r = ROOMS[e.entity_id] || e.area || OTHER; (rooms[r] = rooms[r] || []).push(e.entity_id);
        if (prev !== undefined && prev !== e.state) busyUntil[e.entity_id] = 0; });
      if (room && !rooms[room]) room = null;
      if (!ents.length) { status("Ready"); info("Nothing nominated yet. In Home Assistant, add the <b>Glasses</b> label to the lights and switches you want here."); }
      else { info(""); status("Ready"); render(); }
      timer = setTimeout(load, 4000);
    }).catch(function(e){ if (failed(e) !== null) timer = setTimeout(load, 4000); });
  }

  function toggle(b){
    var id = b.dataset.id, d = id.split(".")[0], dom = "homeassistant", svc = "toggle";
    if (d === "script" || d === "scene") { dom = d; svc = "turn_on"; }
    else if (d === "button" || d === "input_button") { dom = d; svc = "press"; }
    else if (d === "lock") { dom = "lock"; svc = states[id] === "locked" ? "unlock" : "lock"; }
    busyUntil[id] = Date.now() + 4000; b.classList.add("busy");
    status("Switching…");
    ha.service(dom, svc, { entity_id:id }).then(function(){ status("Ready"); setTimeout(load, 600); })
      .catch(function(e){ busyUntil[id] = 0; b.classList.remove("busy"); var t = failed(e); if (t !== null && t !== "Offline") { status("Failed", true); info(String(e && e.message || e)); } });
  }

  status("Connecting…");
  load();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
  window.addEventListener("online", load);
})();
</script>
</body>
</html>
