<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch IPTV channels through Home Assistant">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="TV">
<meta name="theme-color" content="#000000">
<title>TV</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icons/sky-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/sky-apple-180.png">
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px}
  h1{font-size:22px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #status{font-size:17px;color:#8a8a8a;flex:none;margin-left:10px} #status.live{color:#ff5a5a} #status.err{color:#ff6b6b}
  button{font:inherit;color:#fff;background:#141414;border:3px solid transparent;border-radius:16px}
  button:focus{outline:none;border-color:#5ad1ff;background:#1d1d1d}
  #channels{flex:1;overflow-y:auto;padding:0 14px 10px;list-style:none;display:flex;flex-direction:column;gap:8px}
  #channels button{width:100%;padding:16px 18px;font-size:24px;text-align:left}
  #player{flex:1;display:flex;flex-direction:column;min-height:0}
  #screen{flex:1;width:100%;padding:0;background:none;border-radius:10px;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
  video{max-width:100%;max-height:100%;width:100%;display:block;background:#000}
  #paused{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:20px;text-shadow:0 0 6px #000}
  #controls{display:flex;gap:8px;padding:6px 10px 8px}
  #controls button{flex:1;padding:10px;font-size:19px}
  .note{font-size:20px;color:#8a8a8a;line-height:1.35;padding:6px 14px}
  /* picture only: no focus ring round the video, and while playing the title and buttons hide
     (select the picture to bring them back for a few seconds) */
  #screen,#screen:focus{border:0;outline:none;border-radius:0;background:#000}
  body.full header,body.full #controls,body.full #info{display:none!important}
  /* loading screen while a channel starts (replaces the browser's grey play-button placeholder) */
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;pointer-events:none}
  #loading .spin{width:54px;height:54px;border-radius:50%;border:5px solid #26313d;border-top-color:#5ad1ff;animation:spin 0.9s linear infinite}
  #loadname{font-size:26px;font-weight:600}
  #loadmsg{font-size:18px;color:#8a8a8a}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1 id="title">TV</h1><span id="status">Connecting…</span></header>
<ul id="channels" hidden></ul>
<div id="player" hidden>
  <button id="screen" aria-label="Video, select to pause or play"><video id="video" playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video><span id="loading" hidden><span class="spin"></span><span id="loadname"></span><span id="loadmsg">Tuning in…</span></span><span id="paused" hidden>Paused · select to play</span></button>
  <div id="controls"><button id="voldown">🔉 −</button><button id="volup">🔊 +</button><button id="mute">Mute</button><button id="list">Channels</button></div>
</div>
<div id="info" class="note" hidden></div>
<script src="../shared.js?v=12"></script>
<script>
(function () {
  var LABEL = "glasses_tv";     // HA label id: cameras carrying the "Glasses TV" label are listed as channels
  var HLSJS = "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js";
  var $ = function (id) { return document.getElementById(id); };
  var ha = GlassesHA, chans = [], names = {}, current = null, hls = null, vol = 0.8;
  try { vol = parseFloat(localStorage.getItem("tv_vol") || "0.8"); } catch (e) {}
  function status(t, cls){
    var v = $("video");
    $("status").textContent = t; $("status").className = cls === true ? "err" : (cls || "");
  }
  function info(h){ $("info").hidden = !h; $("info").innerHTML = h || ""; }
  function clean(n){ n = String(n).trim(); var w = n.split(/ +/), h = w.length / 2;   // "Sky Sports F1 Sky Sports F1" -> "Sky Sports F1"
    if (w.length % 2 === 0 && w.slice(0,h).join(" ") === w.slice(h).join(" ")) n = w.slice(0,h).join(" ");
    return n; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // Picture only while playing: title and buttons hide a few seconds after they were last used.
  var uiTimer = null;
  function hideUI(){ clearTimeout(uiTimer); if (current && !$("player").hidden && !$("video").paused) document.body.classList.add("full"); }
  function showUI(ms){ document.body.classList.remove("full"); clearTimeout(uiTimer); uiTimer = setTimeout(hideUI, ms || 5000); }
  function loading(on, msg){ $("loading").hidden = !on; if (on) { $("loadname").textContent = names[current] || ""; $("loadmsg").textContent = msg || "Tuning in…"; } }
  function stop(){
    loading(false);
    clearTimeout(uiTimer); document.body.classList.remove("full");   // stopped or paused: show the title and buttons
    if (hls) { hls.destroy(); hls = null; }
    var v = $("video"); v.pause(); v.srcObject = null; v.removeAttribute("src"); v.load();
  }
  function showList(){
    stop(); ha.stopStream(current); current = null; $("player").hidden = true; $("title").textContent = "TV";
    clearTimeout(uiTimer); document.body.classList.remove("full");
    $("channels").hidden = false;
    $("channels").innerHTML = chans.map(function(id){ return '<li><button data-id="' + id + '">' + esc(names[id] || id) + '</button></li>'; }).join("");
    [].forEach.call(document.querySelectorAll("#channels button"), function(b){ b.addEventListener("click", function(){ play(b.dataset.id); }); });
    var f = document.querySelector("#channels button"); if (f) f.focus();
    status(chans.length ? "Pick a channel" : "Ready");
  }
  function loadHlsJs(){
    return new Promise(function(res, rej){
      if (window.Hls) return res(window.Hls);
      var s = document.createElement("script"); s.src = HLSJS; s.onload = function(){ res(window.Hls); }; s.onerror = function(){ rej(new Error("couldn't load player")); };
      document.head.appendChild(s);
    });
  }
  // Start playback; if the browser blocks autoplay with sound, start muted and offer Unmute.
  function startPlay(v){
    return v.play().then(function(){ $("paused").hidden = true; }).catch(function(){
      v.muted = true; $("mute").textContent = "Unmute";
      return v.play().then(function(){ $("paused").hidden = true; info("Playing muted – select <b>Unmute</b> for sound."); })
        .catch(function(){ loading(false); $("paused").textContent = "Select the picture to play"; $("paused").hidden = false; status("Ready"); });
    });
  }
  function play(id){
    stop();
    current = id; $("channels").hidden = true; $("player").hidden = false; $("paused").hidden = true;
    $("title").textContent = names[id] || id; status("Starting…"); $("screen").focus(); loading(true);
    var vv = $("video"); vv.volume = vol;
    // HLS only (no WebRTC, which would open an extra IPTV connection). Home Assistant closes
    // the previous channel's stream before it starts this one, so switching uses one connection.
    playHls(id);
  }
  var restarts = 0, restartsReset = null;
  function playHls(id){
    clearTimeout(restartsReset); restartsReset = setTimeout(function(){ restarts = 0; }, 60000);
    if (hls) { hls.destroy(); hls = null; }
    ha.stream(id).then(function(url){
      // url is HA's /api/glasses_hls/ proxy of /api/hls/ (custom_components/glasses_hls), which allows cross-site playback
      if (current !== id) return;
      var v = $("video");
      v.volume = vol;
      v.onplaying = function(){ loading(false); status("● Live · " + ha.routeName(), "live"); showUI(3000); };
      v.onwaiting = function(){ status("Buffering…"); if (!v.currentTime) loading(true); };
      v.onerror = function(){ loading(false); status("Stream error", true); };
      function viaHlsJs(){ return loadHlsJs().then(function(Hls){
        if (!Hls.isSupported()) throw new Error("this browser can't play HLS");
        // generous timeouts: a freshly started HA stream can take a while to produce its first segments
        // HA only keeps a short live playlist, so start one segment from the live edge instead of hls.js's default three
        hls = new Hls({ lowLatencyMode:false, backBufferLength:30, liveSyncDurationCount:1, liveMaxLatencyDurationCount:4, maxBufferLength:20,
          manifestLoadingTimeOut:30000, manifestLoadingMaxRetry:6, manifestLoadingRetryDelay:1500,
          levelLoadingTimeOut:30000, levelLoadingMaxRetry:8, levelLoadingRetryDelay:1500,
          fragLoadingTimeOut:60000, fragLoadingMaxRetry:8, fragLoadingRetryDelay:1500 });
        var recoveries = 0;
        hls.on(Hls.Events.ERROR, function(_, d){
          if (!d.fatal) return;
          var code = d.response && d.response.code;
          // 404: Home Assistant restarted the stream (new segment numbers), so ask for it again and start over
          if (code === 404 && restarts < 3) { restarts++; status("Reconnecting…"); setTimeout(function(){ if (current === id) playHls(id); }, 1500); return; }
          if (recoveries < 3 && d.type === Hls.ErrorTypes.NETWORK_ERROR) { recoveries++; status("Reconnecting…"); setTimeout(function(){ if (hls) hls.startLoad(); }, 2000); return; }
          if (recoveries < 3 && d.type === Hls.ErrorTypes.MEDIA_ERROR) { recoveries++; hls.recoverMediaError(); return; }
          loading(false); status("Stream error", true); info("Stream problem: " + esc(d.details) + (code !== undefined ? " (" + code + ")" : ""));
        });
        hls.loadSource(url); hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){ startPlay(v); });
      }); }
      if (v.canPlayType("application/vnd.apple.mpegurl")) {
        // native HLS first; if the built-in player rejects it, fall back to hls.js
        v.onerror = function(){ v.onerror = function(){ status("Stream error", true); }; v.removeAttribute("src"); viaHlsJs().catch(function(e){ status("Error", true); info(esc(e.message)); }); };
        v.src = url;
        // if the built-in player is still stuck buffering after 12s, switch to hls.js
        setTimeout(function(){ if (current === id && !hls && v.readyState < 3) { v.onerror = null; v.removeAttribute("src"); v.load(); status("Retrying…"); viaHlsJs().catch(function(e){ status("Error", true); info(esc(e.message)); }); } }, 12000);
        return startPlay(v);
      }
      return viaHlsJs();
    }).catch(function(e){
      var t = ha.describe(e, H); if (t === null) return;
      if (t === "Offline") { status("Offline", true); ha.explain(e, $("info"), function(){ return $("status").textContent === "Offline"; }); setTimeout(function(){ if (current === id && !document.hidden) playHls(id); }, 4000); return; }
      loading(false); status("Error", true); info("Couldn't start " + esc(names[id] || id) + ": " + esc(e && (e.message || e.code) || e));
    });
  }

  $("screen").addEventListener("click", function(){
    var v = $("video");
    if (document.body.classList.contains("full")) { showUI(); return; }   // first select: just show the buttons
    if (current && !hls && !v.getAttribute("src")) { play(current); return; }   // stopped because another app opened
    if (v.paused) { v.play(); $("paused").hidden = true; status("● Live · " + ha.routeName(), "live"); showUI(3000); } else { v.pause(); $("paused").hidden = false; status("Paused"); clearTimeout(uiTimer); document.body.classList.remove("full"); }
  });
  // using the buttons keeps them on screen; any swipe/key while hidden brings them back
  $("controls").addEventListener("click", function(){ showUI(); });
  document.addEventListener("keydown", function(e){ if (e.key !== "Enter" && e.key !== " " && document.body.classList.contains("full")) showUI(); });
  function setVol(d){ var v = $("video"); vol = Math.max(0, Math.min(1, Math.round((vol + d) * 10) / 10)); v.volume = vol; v.muted = false;
    $("mute").textContent = "Mute"; status("Volume " + Math.round(vol * 100) + "%"); try { localStorage.setItem("tv_vol", vol); } catch (e) {} }
  $("volup").addEventListener("click", function(){ setVol(0.1); });
  $("voldown").addEventListener("click", function(){ setVol(-0.1); });
  $("mute").addEventListener("click", function(){ var v = $("video"); v.muted = !v.muted; $("mute").textContent = v.muted ? "Unmute" : "Mute"; if (!v.muted) info(""); });
  $("list").addEventListener("click", function(){ if (chans.length) showList(); });
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) { stop(); ha.stopStream(current); } else if (current) play(current); else if (!chans.length) load();
  });

  var H = {
    noToken: function(){ status("Not set up", true); info("This app needs your Home Assistant access token on the end of its link:<br><b>…/tv/?token=YOUR_TOKEN</b>"); },
    badToken: function(){ status("Token rejected", true); stop(); $("player").hidden = true; $("channels").hidden = true; info("Home Assistant rejected the access token. Re-add the app with a valid token on the link."); }
  };
  function load(){
    status("Connecting…");
    ha.entities(LABEL).then(function(list){
      list = list.filter(function(e){ return e.entity_id.indexOf("camera.") === 0; });
      chans = list.map(function(e){ names[e.entity_id] = clean(e.name); return e.entity_id; });
      if (!chans.length) { status("Ready"); info("No channels yet. In Home Assistant, add the <b>Glasses TV</b> label to the IPTV camera(s) you want here."); return; }
      chans.sort(function(a, b){ return (names[a] || a).localeCompare(names[b] || b); });
      info("");
      if (current) play(current); else if (chans.length === 1) play(chans[0]); else showList();
    }).catch(function(e){ var t = ha.describe(e, H); if (t === null) return; status(t, true); if (t !== "Offline") info(esc(e.message)); else ha.explain(e, $("info"), function(){ return $("status").textContent === "Offline"; }); setTimeout(function(){ if (!chans.length && !document.hidden) load(); }, 4000); });
  }
  // leaving the app: close the channel now rather than after HA's 5-minute idle timeout
  window.addEventListener("pagehide", function(){ stop(); ha.stopStream(current); });
  document.addEventListener("freeze", function(){ stop(); ha.stopStream(current); });
  // leaving the app (even if the glasses keep it running): stop the stream straight away; select the picture to resume
  window.addEventListener("blur", function(){
    if (!current || !hls && !$("video").getAttribute("src")) return;
    stop(); ha.stopStream(current);
    $("paused").textContent = "Stopped · select to play"; $("paused").hidden = false; status("Stopped");
  });
  // another glasses app opened: stop streaming so it can use the connection (select the picture to resume)
  ha.onTvOff(function(){
    if (!current) return;
    stop(); ha.stopStream(current);
    $("paused").textContent = "Stopped · select to play"; $("paused").hidden = false; status("Stopped");
  });
  window.addEventListener("online", function(){ if (!document.hidden) { if (current && $("video").readyState < 3) play(current); else if (!chans.length) load(); } });
  load();
})();
</script>
</body>
</html>
